name: Build greenautarky Supervisor image (2026.10 line)

# WP9.1 (Odoo #1489, epic #1488). Builds the GA Supervisor fork for armv7 AND
# aarch64 and pushes DEV/STAGING tags only:
#
#   ghcr.io/greenautarky/<arch>-hassio-supervisor:ci-<short_sha>
#   ghcr.io/greenautarky/<arch>-hassio-supervisor:<GA_DEV_VERSION>
#
# It never writes a release tag and never touches `latest`. Nothing here
# promotes an image to a channel or a device: that is the release train's job,
# on an explicit trigger.
#
# Why this is not the upstream builder.yml: upstream builds amd64+aarch64 with
# home-assistant/builder, which has no armv7 and needs Home Assistant's
# infrastructure (wheel index credentials, cosign identities). The fork builds
# with plain buildx.
#
# GATE ORDER: build (loaded, not pushed) -> smoke import -> layout -> START ->
# provenance gate -> CVE gate -> push.
# GATE_MODE=block (set below, intended): a red CVE gate stops the job BEFORE the
# push, so no tag is written for an image that failed. GATE_MODE=report would
# push the tag anyway and fail the job afterwards (scannable test image); use it
# only for a throwaway DEV run, never for a build whose version tag a device pulls.
#
# PROVENANCE: every image is stamped with org.opencontainers.image.revision =
# the commit built (github.sha, on every arch), .source, .created, the resolved
# base digest (org.greenautarky.base-digest) and org.greenautarky.build-mode.
# build-mode is DEV for push builds and for workflow_dispatch with build_mode=DEV
# (default), RELEASE only for a dispatch with build_mode=RELEASE.
# scripts/provenance-check.sh fails the job before the push if the labels do not
# match; fixtures: tests/gates/provenance (run by provenance-gate-selftest).

on:
  push:
    branches:
      - "ga/2026.10.5-wp9-1"
      - "ga/2026.10.5-wp9-3"
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Provenance build-mode label (DEV = test build, RELEASE = build of a version a device will pull)"
        type: choice
        options:
          - DEV
          - RELEASE
        default: DEV

env:
  GA_DEV_VERSION: "2026.10.5.3"
  GATE_MODE: block

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} Supervisor
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            build_from: ghcr.io/home-assistant/base-python:3.14-alpine3.24-2026.10.3
            install_python: "false"
            wheels_stage: ga-wheels-none
          - arch: armv7
            runner: ubuntu-latest
            platform: linux/arm/v7
            # GA-owned Alpine 3.24 base (s6-overlay, bashio, tempio); no Python,
            # Dockerfile installs it. See ga-addon-base, ADR-0016.
            build_from: ghcr.io/greenautarky/ga-addon-base-armv7:3.24
            install_python: "true"
            wheels_stage: ga-wheels-armv7
    env:
      IMAGE: ghcr.io/greenautarky/${{ matrix.arch }}-hassio-supervisor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'armv7'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: meta
        env:
          BUILD_MODE_INPUT: ${{ inputs.build_mode }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "ci_tag=ci-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "dev_tag=${GA_DEV_VERSION}" >> "$GITHUB_OUTPUT"
          # build-mode: only an explicit dispatch input can say RELEASE; push builds are DEV.
          MODE="${BUILD_MODE_INPUT:-DEV}"
          case "$MODE" in DEV|RELEASE) ;; *) echo "::error::bad build_mode '$MODE'"; exit 1 ;; esac
          echo "build_mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Resolve the base image digest ONCE; the build uses it and the label records it.
          BASE_DIGEST=$(docker buildx imagetools inspect "${{ matrix.build_from }}" --format '{{.Manifest.Digest}}')
          [[ "$BASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::cannot resolve base digest for ${{ matrix.build_from }}"; exit 1; }
          echo "base_digest=${BASE_DIGEST}" >> "$GITHUB_OUTPUT"
          # The Dockerfile `bind` mounts ./wheels; upstream CI fills it, here it is empty.
          mkdir -p wheels

      - name: Build (load, no push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}@${{ steps.meta.outputs.base_digest }}
            BUILD_VERSION=${{ env.GA_DEV_VERSION }}
            GA_INSTALL_PYTHON=${{ matrix.install_python }}
            GA_WHEELS_STAGE=${{ matrix.wheels_stage }}
          labels: |
            io.hass.type=supervisor
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ env.GA_DEV_VERSION }}
            org.opencontainers.image.title=Home Assistant Supervisor (GA fork)
            org.opencontainers.image.version=${{ env.GA_DEV_VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.greenautarky.base-digest=${{ steps.meta.outputs.base_digest }}
            org.greenautarky.build-mode=${{ steps.meta.outputs.build_mode }}
            org.greenautarky.staging-tag=${{ steps.meta.outputs.ci_tag }}
          tags: local/${{ matrix.arch }}-hassio-supervisor:scan

      # Imports the compiled dependencies the armv7 wheel stage had to build.
      # A green build that cannot import them is the failure this step exists for.
      - name: Smoke - the app and its native dependencies import
        run: |
          docker run --rm --platform ${{ matrix.platform }} --entrypoint python3 \
            local/${{ matrix.arch }}-hassio-supervisor:scan -c "
          import sys, brotli, certifi, cryptography, orjson, yaml, dbus_fast, ciso8601, aiohttp
          import supervisor.const as c
          print('python', sys.version.split()[0])
          print('supervisor', c.SUPERVISOR_VERSION)
          print('brotli', brotli.__version__, 'certifi', certifi.__version__, 'cryptography', cryptography.__version__)
          assert c.SUPERVISOR_VERSION == '${{ env.GA_DEV_VERSION }}', c.SUPERVISOR_VERSION
          "

      # Layout + START tests (2026.10.5.1 shipped green and exited 7 s after
      # start: the add-on base's boot oneshots ran inside a Supervisor image).
      # Both run BEFORE the push, so a broken image never gets a tag.
      - name: Layout - the image is a Supervisor, not an add-on base
        run: scripts/image-layout-check.sh local/${{ matrix.arch }}-hassio-supervisor:scan ${{ matrix.platform }}

      - name: START - container stays up 60 s and the API port answers
        run: HOLD=60 scripts/start-test.sh local/${{ matrix.arch }}-hassio-supervisor:scan ${{ matrix.platform }}

      # Provenance: revision == this commit on every arch, build-mode == expected.
      # Runs BEFORE the push (the 2026.10.5.3 images shipped with no/inherited
      # revision). The expectations come from github.sha / the dispatch input
      # directly, not from the step outputs that fed the labels.
      - name: Provenance GATE - labels tie the image to this commit
        run: |
          scripts/provenance-check.sh \
            --expect-revision "${{ github.sha }}" \
            --expect-mode "${{ inputs.build_mode || 'DEV' }}" \
            --expect-source "${{ github.server_url }}/${{ github.repository }}" \
            --image local/${{ matrix.arch }}-hassio-supervisor:scan

      - name: CVE GATE - distro packages (fixable HIGH/CRITICAL)
        id: gate
        continue-on-error: ${{ env.GATE_MODE == 'report' }}
        run: scripts/cve-gate.sh local/${{ matrix.arch }}-hassio-supervisor:scan

      - name: CVE report - bundled libraries (visibility)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --platform ${{ matrix.platform }} \
            --scanners vuln --pkg-types library --severity HIGH,CRITICAL \
            --exit-code 0 --no-progress \
            local/${{ matrix.arch }}-hassio-supervisor:scan

      - name: Push DEV tags
        run: |
          set -euo pipefail
          pushed=0
          # The version tag is immutable: tag == io.hass.version == const.py, and a
          # device pulls by it. If it already exists, push only the ci tag.
          VER_REF="${IMAGE}:${{ steps.meta.outputs.dev_tag }}"
          tags=("${IMAGE}:${{ steps.meta.outputs.ci_tag }}")
          if docker buildx imagetools inspect "$VER_REF" >/dev/null 2>&1; then
            echo "::notice::$VER_REF already exists - tags are immutable, pushing only the ci tag"
            echo "version tag kept: $(docker buildx imagetools inspect "$VER_REF" | sed -n 's/^Digest: *//p')" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            tags+=("$VER_REF")
          fi
          for t in "${tags[@]}"; do
            docker tag local/${{ matrix.arch }}-hassio-supervisor:scan "$t"
            docker push "$t"
            pushed=$((pushed + 1))
          done
          [ "$pushed" -gt 0 ] || { echo "::error::nothing pushed"; exit 1; }
          echo "Pushed $pushed DEV tag(s) for ${{ matrix.arch }}."

      - name: Fail the job if the gate found something
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::error::CVE gate failed (GATE_MODE=report: the DEV image was pushed for inspection)."
          exit 1
