name: Mirror upstream aarch64 Supervisor plugins into ghcr.io/greenautarky

# Odoo #1485 / WP9.1. Upstream still publishes aarch64 plugin images (it only
# dropped armv7), so for aarch64 we MIRROR by digest instead of rebuilding.
# The digests below are the pin; the mirror is byte-identical (same manifest).
# Each source is CVE-scanned with the coverage rule (exit 2 = scan covered
# nothing = fail). Findings (exit 1) are reported, not blocking: the content is
# upstream's and a mirror cannot fix it.
#
# Tags published per plugin: the upstream tag (honest) and the tag our armv7
# set carries (the haos-version JSON has ONE version per plugin for all arches,
# and the Supervisor pulls <image>:<that version>). Where our armv7 version is a
# GA bump (.1/.2) with no upstream aarch64 twin, it aliases the nearest upstream
# aarch64 tag below it.

on:
  push:
    branches:
      - "ga/aarch64-2025.11.5.10"
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror ${{ matrix.slug }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { slug: dns,       up_tag: "2026.10.0", digest: "sha256:a934744305ddcdeb17e66ea8275e51c56ed2e68d4281f94a0d913a26be435a55", alias: "2026.10.0" }
          - { slug: audio,     up_tag: "2026.10.0", digest: "sha256:d74fd89ac0797614ca0b92291f93151fa5f05d5ce272b814593ec4a11adb3a75", alias: "2026.10.0" }
          - { slug: cli,       up_tag: "2026.10.1", digest: "sha256:23441d3668cb9edad0af0eb0ba2f683d777fed9fdc09dbc47e78bb19d4670603", alias: "2026.10.1" }
          - { slug: multicast, up_tag: "2026.10.0", digest: "sha256:28d29bebdca78e6255454e756009f295412fa517b4145a0f06ac783de745aa35", alias: "2026.10.0" }
          - { slug: supervisor, up_tag: "2025.11.5", digest: "sha256:e0080cb7426f3ed776104942f50c40831e7e0e5e869e7bd70d587fb9dc83f979", alias: "2025.11.5" }
          # observer: no OS package DB (Go binary on minimal base) -> scan=binary (gobinary modules, fail closed on 0)
          - { slug: observer,  up_tag: "2026.08.0", digest: "sha256:a1da54df071945e0c20918f6fc7641f5440d94eb6fdeb6eac797f937b28bf495", alias: "2026.08.0", scan: binary }
    env:
      SRC: ghcr.io/home-assistant/aarch64-hassio-${{ matrix.slug }}
      DST: ghcr.io/greenautarky/aarch64-hassio-${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Source digest still matches the pin
        run: |
          set -euo pipefail
          got=$(docker buildx imagetools inspect "${SRC}:${{ matrix.up_tag }}" --format '{{.Manifest.Digest}}')
          echo "upstream ${SRC}:${{ matrix.up_tag }} = $got"
          [ "$got" = "${{ matrix.digest }}" ] || { echo "::error::upstream tag moved: $got != ${{ matrix.digest }}"; exit 1; }

      - name: CVE scan of the pinned source (coverage rule; exit 1 = findings, reported)
        run: |
          set +e; set -uo pipefail
          docker pull --platform linux/arm64 "${SRC}@${{ matrix.digest }}"
          if [ "${{ matrix.scan }}" = "binary" ]; then
            scripts/cve-gate-binary.sh "${SRC}@${{ matrix.digest }}"; rc=$?
          else
            scripts/cve-gate.sh "${SRC}@${{ matrix.digest }}"; rc=$?
          fi
          echo "cve-gate rc=$rc (0 clean, 1 fixable findings in upstream content, 2 broken scan)"
          [ "$rc" -ne 2 ] || exit 2
          echo "- ${{ matrix.slug }}: cve-gate rc=$rc" >> "$GITHUB_STEP_SUMMARY"

      - name: Mirror by digest and assert identity
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${DST}:${{ matrix.up_tag }}" -t "${DST}:${{ matrix.alias }}" \
            "${SRC}@${{ matrix.digest }}"
          for t in ${{ matrix.up_tag }} ${{ matrix.alias }}; do
            got=$(docker buildx imagetools inspect "${DST}:$t" --format '{{.Manifest.Digest}}')
            # a single-manifest source is wrapped into an index by imagetools: then the pin is the child manifest
            if [ "$got" != "${{ matrix.digest }}" ]; then
              docker buildx imagetools inspect --raw "${DST}:$t" | grep -q "${{ matrix.digest }}" \
                || { echo "::error::mirror $got does not contain pin"; exit 1; }
            fi
            echo "- ${{ matrix.slug }}: ${DST}:$t = $got" | tee -a "$GITHUB_STEP_SUMMARY"
          done
